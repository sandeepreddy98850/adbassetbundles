# A sample job for Bundle_practice.

resources:
  jobs:
    Bakehouse_data_refresh:
      name: Bakehouse_data_refresh

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: customer_360
          notebook_task:
            notebook_path: ../src/customer_360

        - task_key: transaction_refresh
          depends_on:
            - task_key: customer_360
          notebook_task:
            notebook_path: ../src/transactions_summery 

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
